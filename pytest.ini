[pytest]
pythonpath = src
# Scoped to this implementation's own tests. tests/ also holds test files
# belonging to the parallel src/admet work, which is preserved untouched
# and has its own entry points; collecting both would conflate two suites.
testpaths = tests/logd
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
